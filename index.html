<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>핑퐁메이트 - 탁구 일정 공유 플랫폼</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- Auth Container (Login / Register) -->
    <div id="auth-container" class="fixed inset-0 bg-white z-50 flex flex-col justify-center items-center p-4 hidden">
        <!-- Auth content injected by JS -->
    </div>

    <!-- App Container -->
    <div id="app-container" class="h-full flex flex-col w-full">
        <!-- Header -->
        <header class="bg-blue-600 text-white shadow-md z-10 flex-shrink-0">
            <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-xl font-bold"><i class="fa-solid fa-table-tennis-paddle-ball mr-2"></i>핑퐁메이트</h1>
                <button id="btn-create-schedule" class="bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-semibold shadow hidden">
                    <i class="fa-solid fa-plus mr-1"></i>일정 등록
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-content" class="flex-grow overflow-y-auto max-w-md mx-auto w-full relative pb-20 p-4">
            <!-- Content will be injected here by JS -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full z-10 sm:max-w-md sm:left-1/2 sm:-translate-x-1/2">
            <div class="flex justify-around items-center h-16">
                <button class="nav-btn flex flex-col items-center text-blue-600 w-full" data-target="schedules">
                    <i class="fa-solid fa-calendar-check text-xl mb-1"></i>
                    <span class="text-xs">일정</span>
                </button>
                <button class="nav-btn flex flex-col items-center text-gray-400 w-full" data-target="tournaments">
                    <i class="fa-solid fa-trophy text-xl mb-1"></i>
                    <span class="text-xs">대회</span>
                </button>
                <button class="nav-btn flex flex-col items-center text-gray-400 w-full" data-target="profile">
                    <i class="fa-solid fa-user text-xl mb-1"></i>
                    <span class="text-xs">내 정보</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Modals (Chat, Form, etc.) will be dynamically added or hidden here -->
    <div id="modal-container" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex-col justify-end sm:justify-center items-center pb-0 sm:pb-10">
        <div id="modal-content" class="bg-white w-full max-w-md sm:rounded-xl rounded-t-xl h-[90vh] sm:h-auto sm:max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
            <!-- Injected -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <!-- <script src="js/mockData.js"></script> --> <!-- 더이상 mockData를 사용하지 않으므로 주석 처리 -->
    <script src="js/app.js"></script>
</body>
</html>
